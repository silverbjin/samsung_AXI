name: Restaurant Robot MVP CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restaurant-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l0-static:
    name: L0 / syntax and isolated contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install static test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml libxml2-utils
      - name: Validate tracked source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts src tests
          bash -n scripts/*.sh
          xmllint --noout src/restaurant_world/worlds/restaurant.sdf
          python3 -m pytest -q tests/test_static_contract.py tests/test_ros_setup_nounset.py tests/test_owner_wsl2_once.py tests/test_evidence_bundle.py tests/test_perf_profile.py tests/test_samsungaxi_hw_probe.py tests/test_s2_map_contract.py tests/test_s2_map02_contract.py tests/test_s2_map02_gt_pose.py
          echo 'RESTAURANT_CI_L0_STATIC_PASS'

  l1-l2-simulation:
    name: L1 build + L2 real Gazebo no-goal smoke
    needs: l0-static
    runs-on: ubuntu-24.04
    # Preinstalled ROS 2 Jazzy: avoid unstable bare-metal setup-ros apt mirrors.
    container:
      image: ros:jazzy-ros-base-noble
    timeout-minutes: 40
    env:
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: '68'
      GZ_PARTITION: restaurant_ci_${{ github.run_id }}_${{ github.run_attempt }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install official ROS 2 / Gazebo Harmonic runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git python3-colcon-common-extensions python3-yaml xvfb xauth mesa-utils \
            ros-jazzy-ros-base ros-jazzy-ros-gz ros-jazzy-ros-gz-image \
            ros-jazzy-nav2-bringup ros-jazzy-navigation2 ros-jazzy-slam-toolbox \
            ros-jazzy-robot-state-publisher ros-jazzy-tf2-ros
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          ros2 pkg prefix ros_gz_sim
          ros2 pkg prefix nav2_bringup
          gz sim --version
      - name: Checkout pinned official ROBOTIS Waffle Pi source (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/upstream
          git clone --quiet --depth 1 --branch jazzy \
            https://github.com/ROBOTIS-GIT/turtlebot3_simulations.git \
            src/upstream/turtlebot3_simulations
          PIN='45633014a14e8f438495b532a723e4ad45cbbd31'
          if [[ $(git -C src/upstream/turtlebot3_simulations rev-parse HEAD) != "$PIN" ]]; then
            git -C src/upstream/turtlebot3_simulations fetch --quiet --depth 1 origin "$PIN"
            git -C src/upstream/turtlebot3_simulations checkout --quiet --detach "$PIN"
          fi
          test "$(git -C src/upstream/turtlebot3_simulations rev-parse HEAD)" = "$PIN"
          echo "RESTAURANT_CI_ROBOTIS_PIN=$PIN"
      - name: L1 / compile and ROS package discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --event-handlers console_direct+ \
            --packages-up-to restaurant_world restaurant_bringup restaurant_delivery
          set +u
          source install/setup.bash
          set -u
          for pkg in turtlebot3_gazebo restaurant_world restaurant_bringup restaurant_delivery; do
            ros2 pkg prefix "$pkg"
          done
          ROBOTIS_SDF="$(ros2 pkg prefix turtlebot3_gazebo)/share/turtlebot3_gazebo/models/turtlebot3_waffle_pi/model.sdf"
          python3 scripts/prepare_waffle_rgbd.py --source "$ROBOTIS_SDF" --out generated/waffle_pi_rgbd.sdf
          NAV2_PARAMS="$(ros2 pkg prefix nav2_bringup)/share/nav2_bringup/params/nav2_params.yaml"
          python3 scripts/prepare_nav2_params.py --source "$NAV2_PARAMS" --out generated/nav2_params.yaml
          python3 scripts/ci_check_generated.py
          echo 'RESTAURANT_CI_L1_BUILD_PASS'
      - name: L2 / headless Gazebo actual ROS sensor messages (NO GOAL)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p logs
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=10s 240s \
            python3 scripts/ci_gazebo_smoke.py \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --log "$PWD/logs/ci-gazebo.log" \
              --wait-seconds 180
      - name: S2 / actual Gazebo SLAM Toolbox map save + reload (NO NAV GOAL)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p logs generated/s2_maps
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=12s 300s \
            python3 scripts/ci_s2_map_smoke.py \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map-prefix "$PWD/generated/s2_maps/restaurant_map" \
              --log "$PWD/logs/ci-s2-gazebo.log"
      - name: S2-MAP-02 / real restaurant lidar survey and map quality
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p logs generated/s2_full
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=15s 990s \
            python3 scripts/ci_s2_map02.py \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map-prefix "$PWD/generated/s2_full/restaurant_map" \
              --log "$PWD/logs/ci-s2-map02.log"
          cp logs/ci-s2-map02-summary.txt generated/s2_full/ci-s2-map02-summary.txt
      - name: Upload S2-MAP-02 real map and quality evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-s2-map02-full-${{ github.run_id }}
          path: generated/s2_full/
          if-no-files-found: error
          retention-days: 5

      - name: Upload S2 actual map and compact evidence (success only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-s2-real-map-${{ github.run_id }}
          path: |
            generated/s2_maps/restaurant_map.yaml
            generated/s2_maps/restaurant_map.pgm
            logs/ci-s2-summary.txt
            logs/ci-s2-map02-summary.txt
          if-no-files-found: error
          retention-days: 5

      - name: Upload compact failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-ci-first-failure-${{ github.run_id }}
          path: |
            logs/ci-gazebo-summary.txt
            logs/ci-s2-summary.txt
          if-no-files-found: ignore
          retention-days: 5

  publish-s2-map02-candidate:
    name: Publish quality-verified map candidate (not main)
    needs: l1-l2-simulation
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/s2-map02-ci-survey-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: restaurant-s2-map02-full-${{ github.run_id }}
          path: generated/s2_full
      - name: Verify and copy full-room YAML/PGM/quality
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s generated/s2_full/restaurant_map.yaml
          test -s generated/s2_full/restaurant_map.pgm
          test -s generated/s2_full/map02_quality.json
          mkdir -p maps
          cp generated/s2_full/restaurant_map.yaml maps/restaurant_map.yaml
          cp generated/s2_full/restaurant_map.pgm maps/restaurant_map.pgm
          cp generated/s2_full/map02_quality.json maps/restaurant_map_quality.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('maps')
          quality=json.loads((root/'restaurant_map_quality.json').read_text())
          for suffix,field in (('yaml','map_yaml_sha256'),('pgm','map_image_sha256')):
              p=root/('restaurant_map.'+suffix)
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual!=quality[field]:raise SystemExit('MAP_HASH_CONFLICT:'+field)
          if not quality['map'].get('pickup_free_connected_to_table3'):
              raise SystemExit('MAP_NOT_CONNECTED')
          if quality['map'].get('route_waypoints')!=12:
              raise SystemExit('SURVEY_INCOMPLETE')
          evidence={'source_workflow_sha':'${{ github.sha }}',
                    'ci_run':'${{ github.run_id }}','world_sha256':quality['world_sha256'],
                    'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                             for p in (root/'restaurant_map.yaml',root/'restaurant_map.pgm',
                                       root/'restaurant_map_quality.json')}}
          (root/'restaurant_map_manifest.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('S2_MAP02_RELEASE_HASHES_VERIFIED_CANDIDATE_NOT_MAIN')
          PY
      - name: Commit to new maps candidate branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Refuse release if the two exact final maps are still ignored.
          if git check-ignore -q maps/restaurant_map.yaml || git check-ignore -q maps/restaurant_map.pgm; then
            echo 'S2_MAP02_RELEASE_FILES_STILL_IGNORED' >&2
            exit 2
          fi
          git add maps/restaurant_map.yaml maps/restaurant_map.pgm \
                  maps/restaurant_map_quality.json maps/restaurant_map_manifest.json
          git commit -m "artifacts(S2-MAP-02): real Gazebo SLAM map candidate [skip ci]"
          git push origin "HEAD:refs/heads/maps/s2-map02-${{ github.run_id }}"
          echo 'S2_MAP02_MAP_CANDIDATE_CREATED_MAIN_UNCHANGED'
