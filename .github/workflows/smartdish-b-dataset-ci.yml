name: SmartDish B dataset contract CI
on:
  push:
    branches: [feat/smartdish-b-dataset]
    paths:
      - 'ai/**'
      - 'tests/test_b_dataset.py'
      - 'tests/test_b_tray_capture.py'
      - 'tests/test_b_intake_recovery.py'
      - 'tests/test_b_a13_real_data.py'
      - 'tests/test_b_a13_runner.py'
      - 'tests/test_b_a13_diagnostic_archive.py'
      - 'tests/test_b12_receive_diagnostics.py'
      - 'tests/test_b14_a13_independent_groups.py'
      - 'tests/test_b12r_release_cli.py'
      - 'tests/test_b_dacon_qa01.py'
      - 'tests/test_b_a15_audit.py'
      - 'scripts/smartdish_b_a15_qa_one_shot.sh'
      - 'scripts/smartdish_b_a15_qa_bootstrap.sh'
      - 'scripts/smartdish_b_dacon_qa01_one_shot.sh'
      - 'docs/quality/**'
      - 'scripts/smartdish_b12r_one_shot.sh'
      - 'ai/scripts/package_a13_diagnostics.py'
      - 'scripts/smartdish_b_real_data_one_shot.sh'
      - '.github/workflows/smartdish-b-dataset-ci.yml'
  pull_request:
    paths:
      - 'ai/**'
      - 'tests/test_b_dataset.py'
      - 'tests/test_b_tray_capture.py'
      - 'tests/test_b_intake_recovery.py'
      - 'tests/test_b_a13_real_data.py'
      - 'tests/test_b_a13_runner.py'
      - 'tests/test_b_a13_diagnostic_archive.py'
      - 'tests/test_b12_receive_diagnostics.py'
      - 'tests/test_b14_a13_independent_groups.py'
      - 'tests/test_b12r_release_cli.py'
      - 'tests/test_b_dacon_qa01.py'
      - 'tests/test_b_a15_audit.py'
      - 'scripts/smartdish_b_a15_qa_one_shot.sh'
      - 'scripts/smartdish_b_a15_qa_bootstrap.sh'
      - 'scripts/smartdish_b_dacon_qa01_one_shot.sh'
      - 'docs/quality/**'
      - 'scripts/smartdish_b12r_one_shot.sh'
      - 'ai/scripts/package_a13_diagnostics.py'
      - 'scripts/smartdish_b_real_data_one_shot.sh'
      - '.github/workflows/smartdish-b-dataset-ci.yml'
permissions:
  contents: read
jobs:
  b-contract:
    name: B data contract (MOCK_ONLY, no ROS)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test packages
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 pytest==9.0.2
      - name: Validate Python and data contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q ai/scripts tests/test_b_dataset.py tests/test_b_tray_capture.py tests/test_b_intake_recovery.py tests/test_b_a13_real_data.py tests/test_b_a13_runner.py tests/test_b_a13_diagnostic_archive.py tests/test_b12_receive_diagnostics.py tests/test_b14_a13_independent_groups.py tests/test_b12r_release_cli.py tests/test_b_dacon_qa01.py tests/test_b_a15_audit.py
          bash -n scripts/smartdish_b_real_data_one_shot.sh
          bash -n scripts/smartdish_b12r_one_shot.sh
          bash -n scripts/smartdish_b_dacon_qa01_one_shot.sh
          bash -n scripts/smartdish_b_a15_qa_one_shot.sh
          bash -n scripts/smartdish_b_a15_qa_bootstrap.sh
          python -m pytest -q tests/test_b_dataset.py tests/test_b_tray_capture.py tests/test_b_intake_recovery.py tests/test_b_a13_real_data.py tests/test_b_a13_runner.py tests/test_b_a13_diagnostic_archive.py tests/test_b12_receive_diagnostics.py tests/test_b14_a13_independent_groups.py tests/test_b12r_release_cli.py tests/test_b_dacon_qa01.py tests/test_b_a15_audit.py
          TMP="$(mktemp -d)"
          python ai/scripts/prepare_dataset.py --make-fixtures "$TMP"
          python ai/scripts/prepare_dataset.py --manifest "$TMP/manifest.csv" \
            --root "$TMP" --out "$TMP/split.csv" --report "$TMP/quality.json" --allow-fixtures
          if python ai/scripts/prepare_dataset.py --manifest "$TMP/manifest.csv" \
              --root "$TMP" --out "$TMP/unsafe.csv" >"$TMP/reject.log" 2>&1; then
            echo B_FAIL_OPEN_FIXTURE_ERROR; exit 1
          fi
          grep -q B_GROUND_TRUTH_NOT_OBSERVED "$TMP/reject.log"
          echo B_MOCK_ONLY_GUARD_PASS
          echo B_DATASET_CONTRACT_L0_PASS
