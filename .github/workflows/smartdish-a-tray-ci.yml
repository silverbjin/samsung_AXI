name: SmartDish A11-A13 Tray RGB physics evidence
on:
  push:
    branches: [feat/smartdish-a-tray-camera]
    paths:
      - 'scripts/smartdish_tray_*.py'
      - 'scripts/smartdish_a_tray_*.py'
      - 'scripts/smartdish_a_tray_*.sh'
      - 'config/smartdish_tray_bridge.yaml'
      - 'tests/test_smartdish_tray_*.py'
      - 'tests/test_smartdish_a_tray_runner.py'
      - '.github/workflows/smartdish-a-tray-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smartdish-a-tray-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tray-l0:
    name: A11-13 L0 / SDF, RGB/physics evidence, GUI default, safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Python L0 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml python3-pytest python3-pil
      - name: Parse new sources, test no simulated PASS
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/smartdish_tray_camera.py scripts/smartdish_tray_world.py scripts/smartdish_tray_evidence.py scripts/smartdish_a_tray_live.py
          bash -n scripts/smartdish_a_tray_bootstrap.sh
          bash -n scripts/smartdish_a_tray_one_shot.sh
          python3 -m pytest -q tests/test_smartdish_tray_camera.py tests/test_smartdish_tray_world.py tests/test_smartdish_tray_evidence.py tests/test_smartdish_a_tray_runner.py
          echo SMARTDISH_A_TRAY_L0_PASS
  tray-l1:
    name: A11-13 L1 / ROS Jazzy image/TF bridge + A package build NO GOAL
    runs-on: ubuntu-24.04
    needs: tray-l0
    timeout-minutes: 30
    container:
      image: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS/Gazebo Harmonic bridge and build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends             git python3-yaml python3-pil python3-colcon-common-extensions             ros-jazzy-ros-gz ros-jazzy-ros-gz-bridge             ros-jazzy-tf2-msgs ros-jazzy-sensor-msgs             ros-jazzy-nav2-simple-commander
      - name: Build unchanged A ROS package, check bridge types NO GOAL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --event-handlers console_direct+ --packages-select smartdish_robot
          set +u
          source install/setup.bash
          set -u
          ros2 pkg prefix smartdish_robot
          ros2 pkg prefix ros_gz_bridge
          ros2 interface show sensor_msgs/msg/Image > /tmp/a_tray_image_interface.txt
          ros2 interface show tf2_msgs/msg/TFMessage > /tmp/a_tray_tf_interface.txt
          grep -q encoding /tmp/a_tray_image_interface.txt
          grep -q transforms /tmp/a_tray_tf_interface.txt
          python3 - <<'PY'
          import rclpy, yaml
          from sensor_msgs.msg import Image
          from tf2_msgs.msg import TFMessage
          from pathlib import Path
          cfg = yaml.safe_load(Path('config/smartdish_tray_bridge.yaml').read_text())
          assert [x['ros_topic_name'] for x in cfg].count('/smartdish/tray/image_raw')==1
          assert all(x['direction']=='GZ_TO_ROS' for x in cfg)
          print('SMARTDISH_A_TRAY_L1_ROS_BRIDGE_CONTRACT_PASS_NO_GOAL')
          PY
  tray-l2:
    name: A11-13 L2 / REAL Gazebo camera + physical dish motion, four trials
    needs: tray-l1
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    container:
      image: ros:jazzy-ros-base-noble
    env:
      CI: 'true'
      ROS_DISTRO: jazzy
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      GZ_SIM_RENDER_ENGINE: ogre2
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Gazebo / ros_gz_bridge + CPU renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends             git python3-yaml python3-pil python3-colcon-common-extensions             ros-jazzy-ros-gz ros-jazzy-ros-gz-bridge ros-jazzy-ros-base             ros-jazzy-tf2-msgs ros-jazzy-sensor-msgs             xvfb xauth mesa-utils libgl1-mesa-dri
      - name: Real Gazebo four scenarios, reject absent sensor/pose/timestamps
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo SMARTDISH_A_TRAY_L2_FIRST_FAILURE_DIAGNOSTICS; find generated/smartdish_tray -path "*/logs/*.log" -type f -print -exec tail -n 100 {} \; 2>/dev/null || true' ERR
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          xvfb-run -a -s '-screen 0 1280x720x24'             timeout --signal=INT --kill-after=20s 1800s             python3 -u scripts/smartdish_a_tray_live.py batch --headless               --seed 101 --expected-sha "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          found=sorted(Path('generated/smartdish_tray').glob('run_*/summary.json'))
          assert len(found)==1, 'One actual Gazebo run expected'
          d=json.loads(found[0].read_text())
          assert d['verdict']=='GAZEBO_TRAY_L2_PHYSICS_AND_CAMERA_PASS'
          assert len(d['trials'])==4
          print('SMARTDISH_A_TRAY_REAL_GAZEBO_L2_EVIDENCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartdish-a-tray-l2-metadata-${{ github.run_id }}
          path: |
            generated/smartdish_tray/run_*/summary.json
            generated/smartdish_tray/run_*/source_manifest.json
            generated/smartdish_tray/run_*/trial_*/trial_summary.json
            generated/smartdish_tray/run_*/SHA256SUMS
            generated/smartdish_tray/run_*/smartdish_a_tray_evidence.tar.gz
            generated/smartdish_tray/run_*/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
