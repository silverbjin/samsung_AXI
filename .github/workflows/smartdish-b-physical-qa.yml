name: SmartDish B independent physical evidence QA
on:
  push:
    branches: [feat/smartdish-b-product-evidence-qa]
    paths: ['scripts/smartdish_b_product_evidence_qa.py','tests/test_smartdish_b_physical_qa.py','.github/workflows/smartdish-b-physical-qa.yml']
  pull_request:
    branches: [integration/smartdish-product-recovery]
    paths: ['scripts/smartdish_b_product_evidence_qa.py','tests/test_smartdish_b_physical_qa.py','.github/workflows/smartdish-b-physical-qa.yml','docs/reports/smartdish/b/B_PRODUCT_PHYSICAL*']
permissions:
  contents: read
  actions: read
jobs:
  independent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 Pillow==11.3.0 matplotlib==3.10.3 PyYAML==6.0.2
      - name: L0 independent negative tests
        shell: bash
        run: |
          mkdir -p /tmp/bqa-out
          git rev-parse HEAD > /tmp/bqa-out/source_sha.txt
          git merge-base --is-ancestor 57c5f57b471a92ae11adf1d2432d44aa8640d2ad HEAD
          python -m unittest discover -s tests -p test_smartdish_b_physical_qa.py -v 2>&1 | tee /tmp/bqa-out/l0.log
      - name: Download exact existing A artifacts (no Gazebo)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/bqa-input
          for id in 15178590920 15178773153 15184188608 15185112687 15185567891; do
            curl --fail --silent --show-error --location --retry 1 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/silverbjin/samsung_AXI/actions/artifacts/$id/zip" -o "/tmp/bqa-input/github-actions-artifact-$id.zip"
          done
      - name: L1 replay actual bytes / L2 Evidence Review
        run: python scripts/smartdish_b_product_evidence_qa.py --evidence-dir /tmp/bqa-input --out /tmp/bqa-out --repo-root .
      - name: Output checksums
        if: always()
        run: cd /tmp/bqa-out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-independent-physical-qa
          path: /tmp/bqa-out
