name: SmartDish C / Dataset v1 public contract only
on:
  push:
    branches: [feat/smartdish-c-dataset-v1-pilot]
    paths:
      - ai/train/dataset_v1_gate.py
      - ai/docs/C_V1_EXPERIMENT_LOCK.json
      - tests/test_c_dataset_v1_gate.py
      - .github/workflows/smartdish-c-dataset-v1-p0.yml
      - docs/plans/SMARTDISH_C_DATASET_V1_P0_P6_EXECUTION_PLAN_KO.md
      - docs/reports/tasks/2026-11-26_C_V1_P0_P1_P5_P6_EDU_KO.md
  pull_request:
    paths:
      - ai/train/dataset_v1_gate.py
      - ai/docs/C_V1_EXPERIMENT_LOCK.json
      - tests/test_c_dataset_v1_gate.py
      - .github/workflows/smartdish-c-dataset-v1-p0.yml
permissions:
  contents: read
jobs:
  c-v1-p0-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture-only L0 test requirements
        run: python -m pip install pytest pillow
      - name: Audit code-only P0 gates; no B/private/real model used
        run: |
          python -m compileall -q ai/train/dataset_v1_gate.py
          python -m pytest -q tests/test_c_dataset_v1_gate.py
          python -m json.tool ai/docs/C_V1_EXPERIMENT_LOCK.json > /dev/null
          bash -n scripts/smartdish_c_dataset_v1_owner_once.sh
          echo C_V1_L0_FIXTURE_ONLY_PASS_PRIVATE_OWNER_NOT_RUN
