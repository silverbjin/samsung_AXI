name: SmartDish C / Dataset v1 public contract only
on:
  push:
    branches: [feat/smartdish-c-dataset-v1-pilot]
    paths:
      - ai/train/dataset_v1_gate.py
      - ai/train/pilot_eval_gate.py
      - ai/train/seal_v1_research_model.py
      - ai/train/evaluate.py
      - docs/reports/issues/2026-11-26_C_V1_ISSUE_01_TEST_ISOLATION_AND_RELEASE_GUARD_KO.md
      - ai/train/research_approval.py
      - ai/train/p1_pretrained_inspection.py
      - scripts/smartdish_c_v1_p1_pretrained_once.sh
      - scripts/smartdish_c_v1_install_cpu_venv.sh
      - tests/test_c_cpu_venv_contract.py
      - tests/test_c_p1_pretrained_inspection.py
      - ai/train/train_classifier.py
      - ai/evaluation/dataset_contract.py
      - ai/evaluation/stability_model.py
      - src/smartdish_ai/smartdish_ai/model_runtime.py
      - ai/docs/C_V1_EXPERIMENT_LOCK.json
      - tests/test_c_dataset_v1_gate.py
      - tests/test_c_research_runtime_gate.py
      - tests/test_c_pilot_eval_gate.py
      - tests/test_c_research_approval.py
      - .github/workflows/smartdish-c-dataset-v1-p0.yml
      - docs/plans/SMARTDISH_C_DATASET_V1_P0_P6_EXECUTION_PLAN_KO.md
      - docs/reports/tasks/2026-11-26_C_V1_P0_P1_P5_P6_EDU_KO.md
  pull_request:
    paths:
      - ai/train/dataset_v1_gate.py
      - ai/train/pilot_eval_gate.py
      - ai/train/seal_v1_research_model.py
      - ai/train/evaluate.py
      - docs/reports/issues/2026-11-26_C_V1_ISSUE_01_TEST_ISOLATION_AND_RELEASE_GUARD_KO.md
      - ai/train/research_approval.py
      - ai/train/p1_pretrained_inspection.py
      - scripts/smartdish_c_v1_p1_pretrained_once.sh
      - scripts/smartdish_c_v1_install_cpu_venv.sh
      - tests/test_c_cpu_venv_contract.py
      - tests/test_c_p1_pretrained_inspection.py
      - ai/train/train_classifier.py
      - ai/evaluation/dataset_contract.py
      - ai/evaluation/stability_model.py
      - src/smartdish_ai/smartdish_ai/model_runtime.py
      - ai/docs/C_V1_EXPERIMENT_LOCK.json
      - tests/test_c_dataset_v1_gate.py
      - tests/test_c_research_runtime_gate.py
      - tests/test_c_pilot_eval_gate.py
      - tests/test_c_research_approval.py
      - .github/workflows/smartdish-c-dataset-v1-p0.yml
permissions:
  contents: read
jobs:
  c-v1-p0-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture-only L0 test requirements
        run: python -m pip install pytest pillow numpy
      - name: Audit code-only P0 gates; no B/private/real model used
        run: |
          python -m compileall -q ai/train/dataset_v1_gate.py ai/train/research_approval.py ai/train/p1_pretrained_inspection.py ai/train/pilot_eval_gate.py ai/train/seal_v1_research_model.py ai/train/train_classifier.py ai/train/evaluate.py src/smartdish_ai/smartdish_ai/model_runtime.py
          python -m pytest -q tests/test_c_dataset_v1_gate.py tests/test_c_research_approval.py tests/test_c_p1_pretrained_inspection.py tests/test_c_cpu_venv_contract.py tests/test_c_pilot_eval_gate.py tests/test_c_research_runtime_gate.py tests/test_c_stability.py
          python -m json.tool ai/docs/C_V1_EXPERIMENT_LOCK.json > /dev/null
          bash -n scripts/smartdish_c_dataset_v1_owner_once.sh scripts/smartdish_c_v1_p1_pretrained_once.sh scripts/smartdish_c_v1_install_cpu_venv.sh
          echo C_V1_L0_FIXTURE_ONLY_PASS_PRIVATE_OWNER_NOT_RUN
