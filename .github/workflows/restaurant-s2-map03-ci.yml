name: SAMSUNGAXI S2-MAP-03 Additional Coverage
on:
  push:
    branches: [feature/s2-map03-coverage-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samsungaxi-s2-map03-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  l0-route:
    name: S2-MAP-03 L0 / route and quality contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml
      - name: L0 no-regression and new obstacle clearance
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts tests
          python3 -m pytest -q tests/test_s2_map02_contract.py tests/test_s2_map03_coverage.py
          echo S2_MAP03_L0_STATIC_PASS
  l2-real-slam:
    name: S2-MAP-03 L2 / actual Gazebo enhanced SLAM
    needs: l0-route
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ros:jazzy-ros-base-noble
    env:
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: '74'
      GZ_PARTITION: samsungaxi_map03_\${{ github.run_id }}_\${{ github.run_attempt }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Install official Jazzy Harmonic SLAM and Nav2
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git python3-colcon-common-extensions python3-yaml xvfb xauth \
            ros-jazzy-ros-base ros-jazzy-ros-gz ros-jazzy-ros-gz-image \
            ros-jazzy-nav2-bringup ros-jazzy-navigation2 ros-jazzy-slam-toolbox \
            ros-jazzy-robot-state-publisher ros-jazzy-tf2-ros
      - name: Same pinned ROBOTIS Jazzy Waffle Pi
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/upstream
          git clone --quiet --depth 1 --branch jazzy \
            https://github.com/ROBOTIS-GIT/turtlebot3_simulations.git \
            src/upstream/turtlebot3_simulations
          PIN=45633014a14e8f438495b532a723e4ad45cbbd31
          if [[ $(git -C src/upstream/turtlebot3_simulations rev-parse HEAD) != "$PIN" ]]; then
            git -C src/upstream/turtlebot3_simulations fetch --quiet --depth 1 origin "$PIN"
            git -C src/upstream/turtlebot3_simulations checkout --quiet --detach "$PIN"
          fi
          test "$(git -C src/upstream/turtlebot3_simulations rev-parse HEAD)" = "$PIN"
      - name: Build and generate unchanged Waffle Pi RGB-D
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --packages-up-to restaurant_world restaurant_bringup restaurant_delivery
          set +u
          source install/setup.bash
          set -u
          mkdir -p generated
          ROBOTIS_SDF="$(ros2 pkg prefix turtlebot3_gazebo)/share/turtlebot3_gazebo/models/turtlebot3_waffle_pi/model.sdf"
          python3 scripts/prepare_waffle_rgbd.py --source "$ROBOTIS_SDF" --out generated/waffle_pi_rgbd.sdf
      - name: Actual Gazebo new survey with real LiDAR/SLAM SaveMap reload
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p logs generated/s2_map03
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=15s 1350s \
            python3 scripts/ci_s2_map02.py --enhanced-survey \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map-prefix "$PWD/generated/s2_map03/restaurant_map" \
              --log "$PWD/logs/ci-s2-map03.log"
          cp logs/ci-s2-map02-summary.txt generated/s2_map03/ci-s2-map03-summary.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: samsungaxi-s2-map03-candidate-\${{ github.run_id }}
          path: generated/s2_map03/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: samsungaxi-s2-map03-first-failure-\${{ github.run_id }}
          path: |
            logs/ci-s2-map02-summary.txt
            generated/s2_map03/map02_quality.json
          if-no-files-found: ignore
          retention-days: 7
