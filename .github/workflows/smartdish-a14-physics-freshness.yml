name: SmartDish A14 R02-2 Physics Freshness
on:
  push:
    branches: [feat/smartdish-a14-physics-evidence]
    paths:
      - 'scripts/a14_physics_freshness*'
      - 'scripts/a14_physics_freshness/**'
      - 'tests/test_a14_physics_freshness.py'
      - '.github/workflows/smartdish-a14-physics-freshness.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: a14-physics-freshness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  l0:
    name: R02-2 metadata challenge negative contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest
          python3 -m py_compile scripts/a14_physics_freshness_contract.py scripts/a14_physics_freshness_probe.py
          python3 -m pytest -q tests/test_a14_physics_freshness.py
          sha256sum scripts/a14_physics_freshness_contract.py tests/test_a14_physics_freshness.py
  l2:
    name: R02-2 actual Physics refresh and late negative control
    needs: l0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: {image: ros:jazzy-ros-base-noble}
    env:
      CI: 'true'
      ROS_DISTRO: jazzy
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      GZ_SIM_RENDER_ENGINE: ogre2
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - name: Install Jazzy/Harmonic vendor and build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends git cmake g++ make python3-yaml python3-pil \
            ros-jazzy-ros-gz ros-jazzy-ros-gz-bridge ros-jazzy-ros-gz-interfaces \
            ros-jazzy-ros-base ros-jazzy-tf2-msgs ros-jazzy-sensor-msgs \
            ros-jazzy-rosgraph-msgs ros-jazzy-gz-sim-vendor ros-jazzy-gz-plugin-vendor \
            xvfb xauth mesa-utils libgl1-mesa-dri
      - name: Build read-only Harmonic observer
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          mkdir -p generated/smartdish_a14/r02_freshness_build
          dpkg-query -W ros-jazzy-gz-sim-vendor > generated/smartdish_a14/r02_freshness_build/vendor.log
          find /opt/ros/jazzy/opt/gz_sim_vendor -type f -name 'libgz-sim8-physics-system.so*' -exec sha256sum {} + >> generated/smartdish_a14/r02_freshness_build/vendor.log
          cat generated/smartdish_a14/r02_freshness_build/vendor.log
          cmake -S scripts/a14_physics_freshness -B /tmp/a14_health_build \
            2>&1 | tee generated/smartdish_a14/r02_freshness_build/configure.log
          cmake --build /tmp/a14_health_build -j2 \
            2>&1 | tee generated/smartdish_a14/r02_freshness_build/build.log
      - name: One bounded real production geometry diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          xvfb-run -a -s '-screen 0 1280x720x24' timeout --signal=INT --kill-after=10s 115s \
            python3 -u scripts/a14_physics_freshness_probe.py --sha "$GITHUB_SHA" \
              --plugin /tmp/a14_health_build/liba14_physics_freshness.so \
              --out-dir generated/smartdish_a14/r02_freshness_probe
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          p=Path('generated/smartdish_a14/r02_freshness_probe')
          r=json.loads((p/'health_result.json').read_text())
          assert r['source_sha']==os.environ['GITHUB_SHA']
          assert r['source_type']=='REAL_GAZEBO_ECM_AND_ROS'
          assert r['diagnostic_capture_pass'] and r['all_owned_processes_stopped']
          assert r['end_ns']-r['start_ns']==2_000_000_000
          assert all(s['snapshot_coverage_pass'] for s in r['sensors'].values())
          assert any(s['matched_positive_steps']>0 for s in r['sensors'].values())
          assert r['production_contact_health']=='HOLD' and r['rule_candidate']=='UNKNOWN'
          assert not r['human_approved'] and not r['no_contact_inferred_from_silence']
          assert r['ground_truth']=='NOT_OPERATOR_APPROVED'
          assert not (p/'approval_ledger.jsonl').exists()
          bundle=p/'a14_production_health_evidence.tar.gz'
          assert (p/(bundle.name+'.sha256')).read_text().split()[0]==hashlib.sha256(bundle.read_bytes()).hexdigest()
          with tarfile.open(bundle,'r:gz') as f:
              rows=f.extractfile('SHA256SUMS').read().decode().splitlines()
              assert len(rows)>=12
              for line in rows:
                  digest,name=line.split('  ',1)
                  assert hashlib.sha256(f.extractfile(name).read()).hexdigest()==digest
          fresh=json.loads((p/'freshness_result.json').read_text())
          assert fresh['source_sha']==os.environ['GITHUB_SHA'] and fresh['refresh_contract_pass']
          assert all(s['late_negative_detected'] and s['normal_refresh_steps']>0 for s in fresh['sensors'].values())
          assert fresh['production_contact_health']=='HOLD' and not fresh['human_approved']
          print('R02_2_REAL_PHYSICS_COMPONENT_REFRESH_PASS_GT_HOLD')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a14-r02-2-freshness-${{ github.run_id }}
          path: |
            generated/smartdish_a14/r02_freshness_build/*.log
            generated/smartdish_a14/r02_freshness_probe/*
          if-no-files-found: ignore
          retention-days: 14
