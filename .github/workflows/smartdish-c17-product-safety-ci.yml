name: SmartDish C17 product-model admission / AI OFF regression (L0)
on:
  push:
    branches: [feat/smartdish-c17-c19-safe-release]
  pull_request:
    paths:
      - src/smartdish_ai/smartdish_ai/model_runtime.py
      - tests/test_c17_product_model_admission.py
      - .github/workflows/smartdish-c17-product-safety-ci.yml
      - docs/reports/tasks/2026-11-27_C17_PRODUCT_ADMISSION_SAFETY_EDU_KO.md
      - ai/docs/C_V1_FROZEN_RESNET18_NEGATIVE_RESULT_MODEL_CARD_KO.md
      - tests/test_c18_model_card_contract.py
permissions:
  contents: read
jobs:
  c17-safe-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture-only contracts
        run: python -m pip install pytest pillow numpy pyyaml
      - name: Enforce model admission and D/E AI OFF, no model downloads or private assets
        run: |
          python -m compileall -q src/smartdish_ai/smartdish_ai
          python -m pytest -q tests/test_c17_product_model_admission.py \
            tests/test_c_stability.py tests/test_smartdish_d_service.py \
            tests/test_smartdish_d_ui.py tests/test_smartdish_e_contract.py \
            tests/test_c18_model_card_contract.py
          echo C17_AI_OFF_CONTRACT_ONLY_PASS_NO_TRAIN_NO_GAZEBO
  c17-ros-l1-no-goal:
    name: C17 safe admission / ROS Jazzy L1 build, NO GOAL
    needs: c17-safe-l0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build existing A D C packages; never run Nav2 or Gazebo
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-yaml python3-tk
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --event-handlers console_direct+ \
            --packages-select smartdish_robot smartdish_service smartdish_ai
          set +u
          source install/setup.bash
          set -u
          ros2 pkg executables smartdish_ai | grep -Fx 'smartdish_ai stability_inference_node'
          ros2 pkg executables smartdish_service | grep -Fx 'smartdish_service smartdish_manager'
          python3 - <<'PY'
          from smartdish_ai.model_runtime import PRODUCT_APPROVED_CHECKPOINT_SHA256, require_product_model_release
          from smartdish_ai.inference_core import InferenceCore
          from smartdish_service.mission_manager import MissionManager
          assert PRODUCT_APPROVED_CHECKPOINT_SHA256 is None
          try:
              require_product_model_release('6afdcfe526e6dfd7e19e934e9af405d13d2fc4f4f940291ec0ff97cfadd6ab7c')
          except PermissionError as err:
              assert 'C_PRODUCT_MODEL_NOT_APPROVED' in str(err)
          else:
              raise AssertionError('C17_PRODUCT_GATE_FAILED_OPEN')
          d=MissionManager(ai_available=False)
          assert d.handle_request({'request_id':'C17-L1','table_id':'T03','table_wait_s':10,'dropoff_wait_s':5,'ai_enabled':False})
          assert d.drain()[-1][1]['destination_id']=='T03'
          from json import dumps
          core=InferenceCore(None,'none')
          assert core.handle_request(dumps({'request_id':'C17','capture_id':'C17'}))['status']=='UNKNOWN'
          print('C17_L1_ROS_ADMISSION_AND_AI_OFF_CONTRACT_PASS_NO_GOAL')
          PY
