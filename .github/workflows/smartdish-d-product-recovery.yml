name: SmartDish D product recovery L0
on:
  push:
    branches: [feat/smartdish-d-product-fsm]
  pull_request:
    branches: [integration/smartdish-product-recovery]
    paths:
      - 'src/smartdish_service/**'
      - '.github/workflows/smartdish-d-product-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test D contract (fixtures only)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source_sha.txt
          PYTHONPATH=src/smartdish_service python3 -m unittest discover -s src/smartdish_service/test -p test_product_recovery_fsm.py -v 2>&1 | tee evidence/d-l0.log
      - name: Install Tk / Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth scrot
      - name: Xvfb functional UI and exact frame fixture
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src/smartdish_service D_UI_SCREENSHOT="$PWD/evidence/d-ui-fixture.png" xvfb-run -a python3 src/smartdish_service/test/product_recovery_ui_check.py 2>&1 | tee evidence/d-ui.log
      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-product-l0-${{ github.run_id }}
          path: evidence/
