name: SAMSUNGAXI S3 AMCL Real Map CI
on:
  push:
    branches: [main, s3/amcl-nav2-20261120, s3/nav-delivery-20261120, s4/menu-safety-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samsungaxi-s3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  l0-saved-map:
    name: S3 L0 / release map SHA, coordinates and script contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Python test requirements
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml
      - name: Verify committed PGM, YAML and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q scripts src tests
          python3 -m pytest -q tests/test_s3_map_contract.py tests/test_s3_amcl_contract.py tests/test_s3_nav_contract.py tests/test_s4_menu_contract.py
          python3 scripts/s3_map_contract.py "$PWD"
          echo 'RESTAURANT_S3_CI_L0_RELEASE_MAP_PASS'
  l1-l2-amcl:
    name: S3 L1 + L2 / actual Gazebo AMCL and Nav2 NO GOAL
    needs: l0-saved-map
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ros:jazzy-ros-base-noble
    env:
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: '73'
      GZ_PARTITION: samsungaxi_s3_${{ github.run_id }}_${{ github.run_attempt }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      RESTAURANT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install official ROS Jazzy Nav2 and Gazebo Harmonic
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git python3-colcon-common-extensions python3-yaml \
            xvfb xauth mesa-utils ros-jazzy-ros-base ros-jazzy-ros-gz \
            ros-jazzy-ros-gz-image ros-jazzy-nav2-bringup \
            ros-jazzy-navigation2 ros-jazzy-slam-toolbox \
            ros-jazzy-robot-state-publisher ros-jazzy-tf2-ros
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          ros2 pkg prefix nav2_amcl
          ros2 pkg prefix nav2_map_server
          gz sim --version
      - name: Checkout exact official ROBOTIS Jazzy Waffle Pi source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/upstream
          git clone --quiet --depth 1 --branch jazzy \
            https://github.com/ROBOTIS-GIT/turtlebot3_simulations.git \
            src/upstream/turtlebot3_simulations
          PIN='45633014a14e8f438495b532a723e4ad45cbbd31'
          if [[ $(git -C src/upstream/turtlebot3_simulations rev-parse HEAD) != "$PIN" ]]; then
            git -C src/upstream/turtlebot3_simulations fetch --quiet --depth 1 origin "$PIN"
            git -C src/upstream/turtlebot3_simulations checkout --quiet --detach "$PIN"
          fi
          test "$(git -C src/upstream/turtlebot3_simulations rev-parse HEAD)" = "$PIN"
      - name: S3 L1 / build and official Nav2 parameter overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --event-handlers console_direct+ \
            --packages-up-to restaurant_world restaurant_bringup restaurant_delivery
          set +u
          source install/setup.bash
          set -u
          ROBOTIS_SDF="$(ros2 pkg prefix turtlebot3_gazebo)/share/turtlebot3_gazebo/models/turtlebot3_waffle_pi/model.sdf"
          mkdir -p generated
          python3 scripts/prepare_waffle_rgbd.py --source "$ROBOTIS_SDF" --out generated/waffle_pi_rgbd.sdf
          NAV_PARAMS="$(ros2 pkg prefix nav2_bringup)/share/nav2_bringup/params/nav2_params.yaml"
          python3 scripts/prepare_nav2_params.py --source "$NAV_PARAMS" --out generated/nav2_params.yaml
          python3 scripts/ci_check_generated.py
          python3 scripts/s3_map_contract.py "$PWD"
          echo 'RESTAURANT_S3_CI_L1_BUILD_PASS'
      # NAV-02 includes actual AMCL/TF/Action pregoal checks in its single run.
      - name: S3 L2 / actual map server, AMCL, TF and action readiness NO GOAL
        if: github.ref == 'refs/heads/s3/amcl-nav2-20261120'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p generated/s3 logs
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=15s 340s \
            python3 scripts/ci_s3_amcl_smoke.py \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map "$PWD/maps/restaurant_map.yaml" \
              --params "$PWD/generated/nav2_params.yaml" \
              --log "$PWD/logs/ci-s3-amcl.log" \
              --evidence "$PWD/generated/s3/amcl_preflight.json"
      - name: S3-NAV-02 / actual NavigateToPose 1-to-3-to-1 and physical odom
        if: github.ref == 'refs/heads/s3/nav-delivery-20261120'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          export RESTAURANT_ROOT="$PWD"
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=20s 940s \
            python3 scripts/ci_s3_amcl_smoke.py \
              --exercise-goals \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map "$PWD/maps/restaurant_map.yaml" \
              --params "$PWD/generated/nav2_params.yaml" \
              --log "$PWD/logs/ci-s3-nav.log" \
              --evidence "$PWD/generated/s3/nav_delivery.json"
          cp logs/ci-s3-summary.txt logs/ci-s3-nav-summary.txt
      - name: S4-MENU-01 / actual Gazebo menu speeds and Collision Monitor scan STOP
        if: github.ref == 'refs/heads/s4/menu-safety-20261120' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p generated/s4 logs
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=20s 940s \
            FLAGS=(--exercise-goals --menu-safety)
            if [[ "${GITHUB_REF}" == refs/heads/s4/menu-safety-20261120 ]]; then
              # Narrow STOP diagnosis: already GREEN menu-speed trips are not repeated.
              FLAGS=(--s4-stop-only)
            fi
            python3 scripts/ci_s3_amcl_smoke.py \
              "${FLAGS[@]}" \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map "$PWD/maps/restaurant_map.yaml" \
              --params "$PWD/generated/nav2_params.yaml" \
              --log "$PWD/logs/ci-s4-menu.log" \
              --evidence "$PWD/generated/s4/menu_safety.json"
          cp logs/ci-s3-summary.txt logs/ci-s4-summary.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: samsungaxi-s3-amcl-verified-${{ github.run_id }}
          path: |
            generated/s3/amcl_preflight.json
            logs/ci-s3-summary.txt
            generated/s3/nav_delivery.json
            logs/ci-s3-nav-summary.txt
            generated/s4/menu_safety.json
            logs/ci-s4-summary.txt
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: samsungaxi-s3-first-failure-${{ github.run_id }}
          path: |
            logs/ci-s3-summary.txt
            generated/s4/menu_safety.json
          if-no-files-found: ignore
          retention-days: 5
