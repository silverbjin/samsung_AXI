name: SmartDish A Navigation Adapter L0 and L1
on:
  push:
    branches: [feat/smartdish-a-robot]
    paths:
      - 'src/smartdish_robot/**'
      - 'scripts/smartdish_a_wsl2_*.sh'
      - 'scripts/smartdish_a_wsl2_*.py'
      - 'tests/test_smartdish_a_*.py'
      - '.github/workflows/smartdish-a-ci.yml'
      - 'docs/handoff/A_HANDOFF.md'
      - 'docs/reports/tasks/*SMARTDISH-A*'
  pull_request:
    paths:
      - 'src/smartdish_robot/**'
      - 'tests/test_smartdish_a_*.py'
      - '.github/workflows/smartdish-a-ci.yml'
permissions:
  contents: read
jobs:
  l0-contract:
    name: L0 / JSON contract and fail-closed map poses
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Python prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-yaml python3-pytest
      - name: Test A contract, package shape and original map custody
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q src/smartdish_robot scripts/smartdish_a_wsl2_l3.py tests/test_smartdish_a_contract.py tests/test_smartdish_a_package.py tests/test_smartdish_a_wsl2_l3.py
          bash -n scripts/smartdish_a_wsl2_one_shot.sh
          bash scripts/smartdish_a_wsl2_one_shot.sh --help
          python3 -m pytest -q tests/test_smartdish_a_contract.py tests/test_smartdish_a_package.py tests/test_smartdish_a_tty.py tests/test_smartdish_a_wsl2_l3.py
          echo SMARTDISH_A_L0_CONTRACT_PASS
  l1-ros:
    name: L1 / ROS Jazzy ament build and node discovery (NO GOAL)
    needs: l0-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Official packages for existing Nav2 commander
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-yaml \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs ros-jazzy-geometry-msgs
      - name: Build A-only overlay, validate console entry (NO GOAL)
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --event-handlers console_direct+ --packages-select smartdish_robot
          set +u
          source install/setup.bash
          set -u
          ros2 pkg prefix smartdish_robot
          ros2 pkg executables smartdish_robot | grep 'smartdish_robot navigation_adapter'
          python3 - <<'PY'
          from smartdish_robot.contract import parse_goal
          from smartdish_robot.navigation_adapter import NavigationAdapter, JSON_QOS
          assert parse_goal('{"request_id":"A1","leg":"TO_TABLE","destination_id":"T03"}').leg == 'TO_TABLE'
          print("SMARTDISH_A_L1_BUILD_NO_GOAL_PASS")
          PY
