name: S6 single official entry and legacy NO_GOAL contract
on:
  push:
    branches: [release/s6-vision-l3-owner-20261123, docs/s6-single-canonical-owner-entry-20261123, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l0:
    name: S6 release Bash and junior contract no Goal
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest and YAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml
      - name: Fail-closed pinned one-shot static verification
        run: |
          set -Eeuo pipefail
          bash -n scripts/samsungaxi_s6_wsl2_l3_once.sh
          python3 -m pytest -q tests/test_s6_owner_release.py tests/test_s6_canonical_entry.py tests/test_s6_wslg_release.py tests/test_s6_camera_contract.py tests/test_s6_vision_ai.py tests/test_s6_flow_contract.py
          echo S6_SINGLE_CANONICAL_ENTRY_L0_PASS_NO_GOAL
