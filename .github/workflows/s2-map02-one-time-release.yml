name: S2-MAP-02 Verified Map Artifact Promotion (one-time)
on:
  push:
    branches: [maps/s2-map02-release-tooling-20261120]
permissions:
  actions: read
  contents: write
jobs:
  promote-verified-artifact:
    name: Verify GREEN evidence and publish map candidate only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source provenance without regenerating SLAM
        shell: bash
        env:
          SOURCE_SHA: c6271134c86484154b0df02772e03b981724e15a
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git diff --exit-code "$SOURCE_SHA" HEAD -- \
            scripts/ci_s2_map02.py scripts/s2_map02_contract.py \
            scripts/s2_map02_gt_pose.py \
            src/restaurant_world/worlds/restaurant.sdf \
            src/restaurant_bringup/launch/mapping.launch.py
          echo 'S2_MAP02_ORIGINAL_GREEN_SOURCE_UNCHANGED'
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 44551726313
          name: restaurant-s2-map02-full-44551726313
          github-token: ${{ github.token }}
          path: generated/s2_full
      - name: Verify original map hashes, source World and quality gates
        shell: bash
        env:
          SOURCE_SHA: c6271134c86484154b0df02772e03b981724e15a
          SOURCE_RUN: '44551726313'
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          source=Path('generated/s2_full')
          quality=json.loads((source/'map02_quality.json').read_text())
          world=Path('src/restaurant_world/worlds/restaurant.sdf')
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          if sha(world)!=quality['world_sha256']:
              raise SystemExit('S2_MAP02_RELEASE_WORLD_MISMATCH')
          for filename,field in [('restaurant_map.yaml','map_yaml_sha256'),('restaurant_map.pgm','map_image_sha256')]:
              p=source/filename
              if not p.is_file() or p.stat().st_size<100 or sha(p)!=quality[field]:
                  raise SystemExit('S2_MAP02_RELEASE_MAP_SHA_MISMATCH:'+filename)
          metrics=quality['map']
          if metrics.get('route_waypoints')!=12 or not metrics.get('pickup_free_connected_to_table3'):
              raise SystemExit('S2_MAP02_RELEASE_ROUTE_OR_CONNECTED_INVALID')
          if (metrics.get('known',0)<2400 or metrics.get('free',0)<1500 or
              metrics.get('occupied',0)<120 or metrics.get('known_span_x_m',0)<7 or
              metrics.get('known_span_y_m',0)<6):
              raise SystemExit('S2_MAP02_RELEASE_QUALITY_BELOW_CONTRACT')
          header=(source/'restaurant_map.yaml').read_text()
          if not any(line.strip()=='image: restaurant_map.pgm' for line in header.splitlines()):
              raise SystemExit('S2_MAP02_RELEASE_RELATIVE_IMAGE_MISMATCH')
          target=Path('maps');target.mkdir(exist_ok=True)
          for name in ['restaurant_map.yaml','restaurant_map.pgm']:
              shutil.copyfile(source/name,target/name)
          shutil.copyfile(source/'map02_quality.json',target/'restaurant_map_quality.json')
          manifest={'source_workflow_sha':os.environ['SOURCE_SHA'],
                    'ci_run':os.environ['SOURCE_RUN'],
                    'world_sha256':quality['world_sha256'],
                    'files':{p.name:sha(p) for p in
                             (target/'restaurant_map.yaml',target/'restaurant_map.pgm',
                              target/'restaurant_map_quality.json')}}
          (target/'restaurant_map_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('S2_MAP02_RELEASE_ORIGINAL_ARTIFACT_SHA256_AND_QUALITY_PASS')
          PY
      - name: Commit exactly four validated release files
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in maps/restaurant_map.yaml maps/restaurant_map.pgm; do
            if git check-ignore -q "$f"; then
              echo "S2_MAP02_RELEASE_IGNORED=$f" >&2
              exit 3
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maps/restaurant_map.yaml maps/restaurant_map.pgm \
            maps/restaurant_map_quality.json maps/restaurant_map_manifest.json
          git diff --cached --quiet && { echo 'S2_MAP02_RELEASE_NO_CHANGE'; exit 1; }
          git commit -m "artifacts(S2-MAP-02): actual CI SLAM map verified from Run 44551726313 [skip ci]"
          git push origin "HEAD:refs/heads/maps/s2-map02-44551726313"
          echo 'S2_MAP02_MAP_CANDIDATE_CREATED_MAIN_UNCHANGED'
