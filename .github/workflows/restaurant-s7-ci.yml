name: SAMSUNGAXI S7 startup dishes and negative return CI
on:
  push:
    branches: [feature/s7-startup-dishes-negative-teaching-20261123]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samsungaxi-s7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  l0:
    name: S7 L0 startup world and empty-case contract
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Static S7 startup and unchanged S6 contract
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml
          python3 -m compileall -q scripts src tests
          python3 -m pytest -q tests/test_s7_scene.py tests/test_s6_camera_contract.py tests/test_s6_vision_ai.py tests/test_s6_flow_contract.py
          echo S7_STARTUP_WORLD_L0_PASS
