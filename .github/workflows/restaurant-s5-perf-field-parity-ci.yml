name: S5-PERF-01 WSL2 Profiler Active Real Gazebo Regression
on:
  push:
    branches: [fix/s5-perf01-nav-abort-field-parity-20261120]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samsungaxi-s5-perf01-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  l0:
    name: S5-PERF L0 / Nav2 ABORT evidence and profiler field execution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install system pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pytest python3-yaml
      - name: Verify authorization and original sensor freshness threshold
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q tests/test_s5_perf_field_abort.py \
            tests/test_s5_perf01.py \
            tests/test_perf_profile.py \
            tests/test_s5_owner_approval.py \
            tests/test_s5_live_contract.py \
            tests/test_s5_owner_run_id_preflight.py \
            tests/test_gui_owner_one_shot.py
          echo S5_PERF01_L0_SENSOR_AND_PROFILER_CONTRACT_PASS

  l2-rgbd2-candidate:
    name: S5-PERF L2 / baseline RGBD5 real GUI and ACTIVE RTF recorder
    needs: l0
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ros:jazzy-ros-base-noble
    env:
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: '84'
      GZ_PARTITION: samsungaxi_s5perfparity_${{ github.run_id }}_${{ github.run_attempt }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      RESTAURANT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Official ROS Jazzy, Nav2 and Gazebo Harmonic
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git python3-colcon-common-extensions python3-yaml \
            xvfb xauth mesa-utils ros-jazzy-ros-base ros-jazzy-ros-gz \
            ros-jazzy-ros-gz-image ros-jazzy-nav2-bringup \
            ros-jazzy-navigation2 ros-jazzy-slam-toolbox \
            ros-jazzy-robot-state-publisher ros-jazzy-tf2-ros
      - name: Exact reviewed ROBOTIS Jazzy Waffle Pi
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src/upstream
          git clone --quiet --depth 1 --branch jazzy \
            https://github.com/ROBOTIS-GIT/turtlebot3_simulations.git \
            src/upstream/turtlebot3_simulations
          PIN=45633014a14e8f438495b532a723e4ad45cbbd31
          if [[ $(git -C src/upstream/turtlebot3_simulations rev-parse HEAD) != "$PIN" ]]; then
            git -C src/upstream/turtlebot3_simulations fetch --quiet --depth 1 origin "$PIN"
            git -C src/upstream/turtlebot3_simulations checkout --quiet --detach "$PIN"
          fi
          test "$(git -C src/upstream/turtlebot3_simulations rev-parse HEAD)" = "$PIN"
      - name: Build same packages, source and AMCL auto-init params
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --packages-up-to restaurant_world restaurant_bringup restaurant_delivery
          set +u
          source install/setup.bash
          set -u
          mkdir -p generated/s5 logs
          ROBOT_SDF="$(ros2 pkg prefix turtlebot3_gazebo)/share/turtlebot3_gazebo/models/turtlebot3_waffle_pi/model.sdf"
          python3 scripts/prepare_waffle_rgbd.py --source "$ROBOT_SDF" --out generated/waffle_pi_rgbd.sdf --rgbd-rate-hz 5
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          model=ET.parse('generated/waffle_pi_rgbd.sdf')
          assert model.findtext(".//sensor[@name='restaurant_registered_rgbd']/update_rate")=='5'
          assert model.findtext(".//sensor[@name='hls_lfcd_lds']/update_rate")=='10'
          print('S5_PERF_BASELINE_5HZ_LIDAR_10HZ_PASS')
          PY
          NAV_PARAMS="$(ros2 pkg prefix nav2_bringup)/share/nav2_bringup/params/nav2_params.yaml"
          python3 scripts/prepare_nav2_params.py --source "$NAV_PARAMS" \
            --out generated/nav2_params_s5.yaml --auto-initial-pose
          PYTHONPATH="$PWD/scripts" python3 -c \
            'from s3_map_contract import validate_s2_map03_candidate; print("S5_MAP03_CUSTODY_PASS",validate_s2_map03_candidate("."))'
          echo SAMSUNGAXI_S5_L1_BUILD_PASS
      - name: Same session real Gazebo, delay operator TTY 12s then navigate and STOP
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +u
          source install/setup.bash
          set -u
          mkdir -p logs generated/s5
          # Earlier RGBD2 L2 did NOT run the performance collector. Run actual
          # baseline RGBD5 plus recorder and pseudo-TTY approval in one session.
          python3 scripts/s5_perf_profile.py \
            --run-log "$PWD/logs/s5_perf_baseline_real_gazebo.log" \
            --csv-out "$PWD/generated/s5/s5_perf_timeline.csv" \
            --summary-out "$PWD/generated/s5/s5_perf_summary.json" \
            --mode baseline --max-sec 1180 \
            >"$PWD/generated/s5/s5_perf_collector.log" 2>&1 &
          PROFILE_PID=$!
          stop_profile() {
            kill -INT "$PROFILE_PID" 2>/dev/null || :
            wait "$PROFILE_PID" 2>/dev/null || :
          }
          trap stop_profile EXIT
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' \
            timeout --signal=INT --kill-after=25s 1100s \
            python3 scripts/s5_ci_delayed_tty.py \
              --approval-delay-sec 12 \
              --robot-sdf "$PWD/generated/waffle_pi_rgbd.sdf" \
              --map "$PWD/maps/candidates/s2_map03/restaurant_map.yaml" \
              --params "$PWD/generated/nav2_params_s5.yaml" \
              --log "$PWD/logs/s5_owner_delayed_gazebo.log" \
              --evidence "$PWD/generated/s5/s5_owner_delayed_evidence.json" \
              2>&1 | tee "$PWD/logs/s5_perf_baseline_real_gazebo.log"
          NAV_RC=${PIPESTATUS[0]}
          set -e
          stop_profile
          trap - EXIT
          if [[ "$NAV_RC" -ne 0 ]]; then
            tail -n 150 logs/s5_perf_baseline_real_gazebo.log > generated/s5/s5_first_failure.txt
            echo "S5_PERF_BASELINE_PROFILER_L2_HOLD NAV_RC=$NAV_RC"
            exit "$NAV_RC"
          fi
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('generated/s5/s5_perf_summary.json')
          rows=list(csv.DictReader(Path('generated/s5/s5_perf_timeline.csv').open()))
          d=json.loads(p.read_text())
          assert d['profile_mode']=='baseline'
          assert d['rtf']['all']['sample_count']>=10
          assert len(rows)>=10
          print('S5_PERF_BASELINE_RTF_SAMPLE_PRESENCE_PASS')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('generated/s5/s5_owner_delayed_evidence.json').read_text())
          ack=d['s5_owner_approval']
          assert ack['authorized'] is True
          assert ack['freshness_verified'] is True
          assert ack['wait_seconds'] >= 10.0
          assert ack['scan_count_after_approval'] > 0
          assert ack['odom_count_after_approval'] > 0
          assert d.get('manual_initial_pose_published') is False
          assert d.get('s5_integrated') is True
          assert d.get('delivery_return') is True
          assert len(d.get('real_nav_legs',[])) == 2
          assert 's4_menu_speed' in d
          assert d.get('s4_safety_stop',{}).get('cm_state') == 'STOP'
          assert d['s4_safety_stop']['filtered_output_max_abs_mps']<=.025
          assert d['s4_safety_stop']['physical_odom_motion_m']<=.045
          print('S5_OWNER_DELAYED_TTY_REAL_GAZEBO_L2_PASS')
          print('S5_PERF_PROFILED_BASELINE_REAL_GAZEBO_L2_PASS')
          PY
          cp logs/ci-s3-summary.txt generated/s5/s5_owner_delayed_compact_diagnostics.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: samsungaxi-s5-perf-baseline-profiled-verified-${{ github.run_id }}
          path: |
            generated/s5/
            generated/waffle_pi_rgbd.sdf
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: samsungaxi-s5-perf-baseline-profiled-first-failure-${{ github.run_id }}
          path: |
            generated/s5/s5_owner_delayed_evidence.json
            generated/s5/s5_perf_summary.json
            generated/s5/s5_perf_timeline.csv
            generated/s5/s5_first_failure.txt
            logs/ci-s3-summary.txt
          if-no-files-found: ignore
          retention-days: 14
